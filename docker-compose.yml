# HomologaFISEI · Sprint 1
# Levantar todo:  docker compose up -d --build
# Página de demo: http://localhost:3000

x-servicio: &servicio
  restart: on-failure
  depends_on:
    sqlserver: { condition: service_healthy }
    rabbitmq: { condition: service_started }

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Homologa2026*"
    ports: ["1433:1433"]
    volumes:
      - sqlserver-datos:/var/opt/mssql # los datos no se pierden al apagar
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Homologa2026*' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"] # panel: http://localhost:15672 (guest / guest)

  api-gateway:
    build: ./api-gateway
    restart: on-failure
    environment:
      PORT: "3000"
      MS_IDENTIDAD: http://ms-identidad:3001
      MS_CATALOGO: http://ms-catalogo:3002
      MS_REGLAS: http://ms-motor-reglas:3004
      MS_AGENTE: http://ms-agente-ia:3005
      MS_SOLICITUDES: http://ms-solicitudes:3003
      MS_DOCUMENTOS: http://ms-documentos:3006
      JWT_SECRETO: homologa-sprint2-secreto
    ports: ["3000:3000"]
    depends_on: [ms-identidad, ms-catalogo, ms-motor-reglas, ms-agente-ia, ms-solicitudes]

  ms-identidad:
    <<: *servicio
    build: ./ms-identidad
    environment:
      PORT: "3001"
      SERVICIO: ms-identidad
      DATABASE_URL: "sqlserver://sqlserver:1433;database=identidad_db;user=sa;password=Homologa2026*;trustServerCertificate=true"
      JWT_SECRETO: homologa-sprint2-secreto
      ADMIN_CORREO: admin@uta.edu.ec
      ADMIN_CLAVE: Admin2026*
    ports: ["3001:3001"]

  ms-catalogo:
    <<: *servicio
    build: ./ms-catalogo
    environment:
      PORT: "3002"
      SERVICIO: ms-catalogo
      DATABASE_URL: "sqlserver://sqlserver:1433;database=catalogo_db;user=sa;password=Homologa2026*;trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports: ["3002:3002"]

  ms-motor-reglas:
    <<: *servicio
    build: ./ms-motor-reglas
    environment:
      PORT: "3004"
      SERVICIO: ms-motor-reglas
      DATABASE_URL: "sqlserver://sqlserver:1433;database=reglas_db;user=sa;password=Homologa2026*;trustServerCertificate=true"
    ports: ["3004:3004"]

  ms-agente-ia:
    <<: *servicio
    build: ./ms-agente-ia
    environment:
      PORT: "3005"
      SERVICIO: ms-agente-ia
      DATABASE_URL: "sqlserver://sqlserver:1433;database=homologacion_db;user=sa;password=Homologa2026*;trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      IA_PROVEEDOR: ${IA_PROVEEDOR:-gemini} # gemini, groq u ollama (ver .env.example)
      IA_API_KEY: ${IA_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      IA_URL: ${IA_URL:-}
      MS_CATALOGO: http://ms-catalogo:3002
      MS_REGLAS: http://ms-motor-reglas:3004
    ports: ["3005:3005"]
    extra_hosts: ["host.docker.internal:host-gateway"] # para usar Ollama instalado en la PC

  ms-solicitudes:
    <<: *servicio
    build: ./ms-solicitudes
    environment:
      PORT: "3003"
      SERVICIO: ms-solicitudes
      DATABASE_URL: "sqlserver://sqlserver:1433;database=solicitudes_db;user=sa;password=Homologa2026*;trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MS_CATALOGO: http://ms-catalogo:3002
    ports: ["3003:3003"]

volumes:
  sqlserver-datos:
