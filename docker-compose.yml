# HomologaFISEI · Sprint 1
# Levantar todo:  docker compose up -d --build
# Página de demo: http://localhost:3000

x-servicio: &servicio
  restart: on-failure
  depends_on:
    sqlserver: { condition: service_healthy }
    rabbitmq: { condition: service_started }

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SQL_CLAVE_SQLCMD: ${SQL_CLAVE}
      MSSQL_SA_PASSWORD: ${SQL_CLAVE:?Falta SQL_CLAVE en .env (copia .env.example)}
    ports: ["1433:1433"]
    volumes:
      - sqlserver-datos:/var/opt/mssql # los datos no se pierden al apagar
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SQL_CLAVE_SQLCMD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"] # panel: http://localhost:15672 (guest / guest)

  api-gateway:
    build: ./api-gateway
    restart: on-failure
    environment:
      PORT: "3000"
      MS_IDENTIDAD: http://ms-identidad:3001
      MS_CATALOGO: http://ms-catalogo:3002
      MS_REGLAS: http://ms-motor-reglas:3004
      MS_AGENTE: http://ms-agente-ia:3005
      MS_SOLICITUDES: http://ms-solicitudes:3003
      MS_DOCUMENTOS: http://ms-documentos:3006
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
    ports: ["3000:3000"]
    depends_on: [ms-identidad, ms-catalogo, ms-motor-reglas, ms-agente-ia, ms-solicitudes, ms-documentos]

  ms-identidad:
    <<: *servicio
    build: ./ms-identidad
    environment:
      PORT: "3001"
      SERVICIO: ms-identidad
      DATABASE_URL: "sqlserver://sqlserver:1433;database=identidad_db;user=sa;password=${SQL_CLAVE};trustServerCertificate=true"
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      ADMIN_CORREO: admin@uta.edu.ec
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Falta ADMIN_CLAVE en .env (copia .env.example)}
    ports: ["3001:3001"]

  ms-catalogo:
    <<: *servicio
    build: ./ms-catalogo
    environment:
      PORT: "3002"
      SERVICIO: ms-catalogo
      DATABASE_URL: "sqlserver://sqlserver:1433;database=catalogo_db;user=sa;password=${SQL_CLAVE};trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MS_AGENTE: http://ms-agente-ia:3005 # lee con IA los planes que no tienen el formato de la FISEI
      PLANES_DIR: /planes
    ports: ["3002:3002"]
    volumes:
      - ./planes:/planes:ro # importar planes por ruta: escribir "planes/SW" en Administración

  ms-motor-reglas:
    <<: *servicio
    build: ./ms-motor-reglas
    environment:
      PORT: "3004"
      SERVICIO: ms-motor-reglas
      DATABASE_URL: "sqlserver://sqlserver:1433;database=reglas_db;user=sa;password=${SQL_CLAVE};trustServerCertificate=true"
    ports: ["3004:3004"]

  ms-agente-ia:
    <<: *servicio
    build: ./ms-agente-ia
    environment:
      PORT: "3005"
      SERVICIO: ms-agente-ia
      DATABASE_URL: "sqlserver://sqlserver:1433;database=homologacion_db;user=sa;password=${SQL_CLAVE};trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      IA_PROVEEDOR: ${IA_PROVEEDOR:-gemini} # gemini, groq, ollama o claude (ver .env.example)
      IA_API_KEY: ${IA_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      IA_URL: ${IA_URL:-}
      MS_CATALOGO: http://ms-catalogo:3002
      MS_REGLAS: http://ms-motor-reglas:3004
      MS_DOCUMENTOS: http://ms-documentos:3006 # T43: el agente lee el texto de los sílabos
    ports: ["3005:3005"]
    extra_hosts: ["host.docker.internal:host-gateway"] # para usar Ollama instalado en la PC

  ms-solicitudes:
    <<: *servicio
    build: ./ms-solicitudes
    environment:
      PORT: "3003"
      SERVICIO: ms-solicitudes
      DATABASE_URL: "sqlserver://sqlserver:1433;database=solicitudes_db;user=sa;password=${SQL_CLAVE};trustServerCertificate=true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MS_CATALOGO: http://ms-catalogo:3002
    ports: ["3003:3003"]

  ms-documentos:
    build: ./ms-documentos
    restart: on-failure
    environment:
      PORT: "3006"
      SERVICIO: ms-documentos
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MS_SOLICITUDES: http://ms-solicitudes:3003
      MS_CATALOGO: http://ms-catalogo:3002 # nombres de las carreras en el informe PDF
    ports: ["3006:3006"]
    depends_on: [rabbitmq]
    volumes:
      - documentos-archivos:/datos/archivos # los PDF subidos no se pierden al apagar

  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  sqlserver-datos:
  documentos-archivos:
