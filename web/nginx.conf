server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api-gateway:3000;
        client_max_body_size 20m;
        proxy_read_timeout 180s; # el agente de IA puede tardar mas de 60 s (E-2)
    }

    location / {
        try_files $uri /index.html;
    }
}